[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sevenmlabs-numerology"
version = "1.1.0"
description = "SDK thần số học Pythagorean ngoại tuyến: chỉ số họ tên, ngày sinh, chu kỳ, Đỉnh cao và Essence; lõi Rust, quy tắc có phiên bản và các bước rút gọn."
requires-python = ">=3.10"
authors = [{name = "7mlabs"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
[project.urls]
Source = "https://github.com/7mlabs-workspace/sdk-numerology"
[tool.setuptools]
packages = ["sevenmlabs_numerology"]
include-package-data = false
[tool.setuptools.package-data]
sevenmlabs_numerology = ["native/**/*", "LICENSE", "THIRD-PARTY-NOTICES.txt"]
