<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="title desc"><title id="title">From inputs to payload</title><desc id="desc">Input → shared Rust core → JSON with calculation provenance.</desc><defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#145BFF"/><stop offset="1" stop-color="#623DCA"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#637DBA" stroke-width="1.5"/></marker></defs><rect width="1280" height="240" rx="20" fill="#FFFFFF"/><rect x=".5" y=".5" width="1279" height="239" rx="19.5" fill="none" stroke="#DCE2F0"/><rect x="30" y="36" width="334" height="155" rx="14" fill="#F4F6FF" stroke="#DCE3F5"/><text x="54" y="69" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#5267A2" letter-spacing="1.6">01 / INPUT</text><text x="54" y="112" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#0B1023" >Name · Birth date</text><text x="54" y="148" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4C5A78" >Scope &amp; options</text><rect x="473" y="36" width="334" height="155" rx="14" fill="url(#core)" stroke="#698FFF"/><text x="497" y="69" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#D9E3FF" letter-spacing="1.6">02 / CALCULATION</text><text x="497" y="112" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" >Shared Rust core</text><text x="497" y="148" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#D9E3FF" >Normalize · Calculate · Reduce</text><rect x="916" y="36" width="334" height="155" rx="14" fill="#F4F6FF" stroke="#DCE3F5"/><text x="940" y="69" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#5267A2" letter-spacing="1.6">03 / OUTPUT</text><text x="940" y="112" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#0B1023" >JSON payload</text><text x="940" y="148" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4C5A78" >Values · Rules · Provenance</text><path d="M378 113H454" stroke="#637DBA" stroke-width="2" marker-end="url(#arrow)"/><path d="M821 113H897" stroke="#637DBA" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5267A2" text-anchor="middle">name  /  birth  /  cycles  /  essence  /  profile  /  names</text></svg>
